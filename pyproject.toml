[build-system]
requires = ["setuptools>=45", "wheel", "cffi>=1.0.0", "pycparser"]
build-backend = "setuptools.build_meta"

[project]
name = "sciencemode-cffi"
version = "1.0.0"
description = "Python wrapper for ScienceMode SMPT library using CFFI"
readme = "README.md"
license = {text = "LGPL-3.0"}
authors = [
    {name = "ScienceMode Contributors"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Lesser General Public License v3 (LGPLv3)",
    "Operating System :: OS Independent",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "cffi>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/ScienceMode/ScienceMode4_python_wrapper"
Repository = "https://github.com/ScienceMode/ScienceMode4_python_wrapper"
Issues = "https://github.com/ScienceMode/ScienceMode4_python_wrapper/issues"

[tool.setuptools]
packages = ["sciencemode"]
include-package-data = true

[tool.setuptools.package-data]
sciencemode = [
    "*.dll",
    "*.so", 
    "*.so.*",
    "*.dylib",
    "*.a",
    "*.lib",
    "include/**/*.h",
]

[tool.cibuildwheel]
# Skip Python 3.6, 3.7 since we require Python >=3.8
# Skip 32-bit builds as they're rarely needed for scientific libraries  
# Skip PyPy by default (can be enabled if needed)
skip = ["cp36-*", "cp37-*", "cp38-*", "cp14t-*", "cp14-*", "*-win32", "*-manylinux_i686", "*-musllinux_i686", "pp*"]

# Build environment setup
environment = { CIBUILDWHEEL = "1" }

before-build = [
    "python --version",
]

# Test the built wheels
test-requires = ["pytest"]

# Skip testing on emulated architectures for faster builds
test-skip = "*-*linux_{aarch64,ppc64le,s390x,armv7l,riscv64}"

[tool.cibuildwheel.macos] 
# Skip ARM64 testing on Intel Macs since they can't run natively
test-skip = "*-macosx_arm64 *-macosx_universal2:arm64"

